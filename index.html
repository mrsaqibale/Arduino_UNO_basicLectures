


<body>

    <img name="image" src="off.webp" alt="Light">

    <button name="button" id="b1" onclick="toggleImage()">On</button>
</body>

<script>
function toggleImage() {
    
    console.log(document.image.src.includes('off.webp'));
    if (document.image.src.includes('off.webp')) {
        document.image.src = 'on.webp';
        document.button.textContent='Off';
     
    } else {
        document.image.src = 'off.webp';
        document.button.textContent = 'On';
    }
}
</script>


<style> 
    button{
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 20px 40px;
        font-size: 24px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }
</style>
